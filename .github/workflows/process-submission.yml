name: Process Reference Submission

on:
  issues:
    types: [labeled]

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  create-pr:
    # Only run when a maintainer adds the 'approved' label
    if: github.event.label.name == 'approved'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'

      # The bot compiles every pattern with Ruby's Regexp, so the catalogue
      # does too: a pattern JavaScript accepts can still be one Ruby refuses.
      - uses: ruby/setup-ruby@7f797815d8adceb1c412e7abefdd1ab4abc47a5f # v1.335.0
        with:
          ruby-version: '3.4'

      # The entry goes into api/v2/catalogue.json, the source of truth, and
      # api/v1/references.json (what the Slack bot reads) is rebuilt from it.
      # Issue text reaches the script through env, never through an expression
      # inside a shell line, so nothing typed in an issue can run as a command.
      - name: Add the entry to the catalogue
        id: entry
        env:
          ISSUE_BODY: ${{ github.event.issue.body }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          ISSUE_AUTHOR: ${{ github.event.issue.user.login }}
        run: node scripts/submission.mjs

      - name: Open the pull request
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          ISSUE_AUTHOR: ${{ github.event.issue.user.login }}
          BRANCH: ${{ steps.entry.outputs.branch }}
          LABEL: ${{ steps.entry.outputs.label }}
        run: |
          # Labelled approved a second time: the first run's branch and PR already exist.
          if git ls-remote --exit-code --heads origin "$BRANCH" >/dev/null; then
            printf 'This submission already has a branch, `%s`. To submit it again, close its pull request, delete the branch, then add the approved label again.\n' "$BRANCH" > "$RUNNER_TEMP/exists.md"
            gh issue comment "$ISSUE_NUMBER" --body-file "$RUNNER_TEMP/exists.md"
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git switch -c "$BRANCH"
          git add api/v2/catalogue.json api/v1/references.json
          git commit -m "feat: add \"$LABEL\" reference (closes #$ISSUE_NUMBER)"
          git push origin "$BRANCH"
          url=$(gh pr create --base main --head "$BRANCH" --title "Add reference: $LABEL" --body-file "$RUNNER_TEMP/pr-body.md")
          printf '✅ PR opened: %s\n\nThanks for submitting **%s**, @%s! A maintainer will review and merge it shortly.\n' "$url" "$LABEL" "$ISSUE_AUTHOR" > "$RUNNER_TEMP/thanks.md"
          gh issue comment "$ISSUE_NUMBER" --body-file "$RUNNER_TEMP/thanks.md"

      - name: Explain a refused submission
        if: failure() && steps.entry.outcome == 'failure'
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: |
          test -f "$RUNNER_TEMP/refusal.md" || printf 'The submission could not be processed. A maintainer will check the workflow run.\n' > "$RUNNER_TEMP/refusal.md"
          gh issue comment "$ISSUE_NUMBER" --body-file "$RUNNER_TEMP/refusal.md"
