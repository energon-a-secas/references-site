name: check

# The catalogue on every push and pull request: it validates, every pattern
# compiles in Ruby as the Slack bot compiles it, api/v1/references.json was
# rebuilt from it, and the tests pass. A hand-edited catalogue PR gets the
# same checks a submission does. Plain node and ruby, no install, no secrets.
on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  catalogue:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'

      - uses: ruby/setup-ruby@7f797815d8adceb1c412e7abefdd1ab4abc47a5f # v1.335.0
        with:
          ruby-version: '3.4'

      - name: make check
        run: make check

      - name: make test
        run: make test
